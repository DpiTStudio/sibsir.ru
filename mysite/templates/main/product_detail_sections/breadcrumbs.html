    <!-- 1. BREADCRUMBS -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb mb-0 py-2 px-3 bg-white rounded-pill shadow-sm border border-light-subtle d-inline-flex">
            <li class="breadcrumb-item">
                <a href="{% url 'main:index' %}" class="text-decoration-none text-muted">
                    <i class="bi bi-house-door me-1"></i>Главная
                </a>
            </li>
            <li class="breadcrumb-item">
                <a href="{% url 'main:catalog' %}" class="text-decoration-none text-muted">
                    Каталог продукции
                </a>
            </li>
            {% if product.category %}
            <li class="breadcrumb-item">
                <a href="{% url 'main:catalog' %}?cat={{ product.category.slug }}" class="text-decoration-none text-muted">
                    {{ product.category.name }}
                </a>
            </li>
            {% endif %}
            <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page">{{ product.title }}</li>
        </ol>
    </nav>
