    <!-- 6. CATEGORY SEO TEXT BLOCK -->
    {% if current_category and current_category.seo_text %}
    <div class="mt-4 p-4 p-md-5 rounded-4 bg-white border shadow-sm category-seo-article">
        <div class="d-flex align-items-center gap-2 mb-3 text-warning">
            <i class="bi bi-patch-check-fill fs-5"></i>
            <h2 class="h5 fw-bold text-dark mb-0">О категории «{{ current_category.name }}»</h2>
        </div>
        <div class="text-secondary lh-lg mb-0" style="font-size: 0.95rem;">
            {{ current_category.seo_text|safe|linebreaks }}
        </div>
    </div>
    {% endif %}

</div>
