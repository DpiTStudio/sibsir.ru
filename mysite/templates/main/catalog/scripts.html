<!-- JAVASCRIPT: ADVANCED E-COMMERCE CATALOG ENGINE -->
<script>
    const ITEMS_PER_PAGE = 9;
    let currentPage = 1;
    let activeQuickFilter = 'all'; // 'all', 'sale', 'hits', 'gost', 'favorites'
    let activePriceFilter = 'all'; // 'all', 'under_300', '300_600', 'over_600'
    let currentQvProductId = null;

    // LocalStorage key for favorites
    const FAV_STORAGE_KEY = 'sib_catalog_favorites';

    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveFavorites(favs) {
        try {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favs));
        } catch (e) {}
        updateFavoritesBadges();
    }

    function updateFavoritesBadges() {
        const favs = getFavorites();
        const count = favs.length;
        const badge = document.getElementById('favCounterBadge');
        if (badge) badge.textContent = count;

        // Sync favorite buttons
        document.querySelectorAll('.btn-card-fav').forEach(btn => {
            const cardCol = btn.closest('.product-card-col');
            if (cardCol) {
                const id = parseInt(cardCol.getAttribute('data-id'));
                const isFav = favs.includes(id);
                btn.classList.toggle('active', isFav);
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.className = isFav ? 'bi bi-heart-fill' : 'bi bi-heart';
                }
            }
        });
    }

    function toggleFavorite(e, id, title) {
        if (e) e.stopPropagation();
        id = parseInt(id);
        let favs = getFavorites();
        const index = favs.indexOf(id);
        const isNowFav = index === -1;

        if (isNowFav) {
            favs.push(id);
            if (typeof showToast === 'function') {
                showToast(`«${title}» добавлен в избранное! ❤️`);
            }
        } else {
            favs.splice(index, 1);
            if (typeof showToast === 'function') {
                showToast(`«${title}» удален из избранного.`);
            }
        }
        saveFavorites(favs);

        if (activeQuickFilter === 'favorites') {
            applyCatalogFilters();
        }
    }

    function toggleFavFilter() {
        if (activeQuickFilter === 'favorites') {
            setQuickFilter('all');
        } else {
            setQuickFilter('favorites');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        // Restore view mode from localStorage
        const savedView = localStorage.getItem('sib_catalog_view_mode');
        if (savedView && window.innerWidth >= 768) {
            switchViewMode(savedView, false);
        }

        // Favorites state sync
        updateFavoritesBadges();

        // URL parameters init
        const urlParams = new URLSearchParams(window.location.search);
        const catParam = urlParams.get('cat');
        const sortParam = urlParams.get('sort');
        const qParam = urlParams.get('q');
        const filterParam = urlParams.get('filter');
        const pageParam = parseInt(urlParams.get('page')) || 1;

        if (pageParam > 1) {
            currentPage = pageParam;
        }

        if (sortParam && document.getElementById('catalogSortSelect')) {
            document.getElementById('catalogSortSelect').value = sortParam;
        }

        if (qParam && document.getElementById('catalogSearchInput')) {
            document.getElementById('catalogSearchInput').value = qParam;
        }

        if (filterParam) {
            setQuickFilter(filterParam, false, false);
        }

        if (catParam) {
            filterCatalog(catParam, false, false);
        } else if (window.location.hash) {
            const hashCat = window.location.hash.replace('#', '');
            if (hashCat) {
                filterCatalog(hashCat, false, false);
            }
        } else {
            applyCatalogFilters(false, false);
        }

        // Sticky Bar Scroll Listener
        window.addEventListener('scroll', function() {
            const stickyBar = document.getElementById('catalogStickyBar');
            if (!stickyBar) return;
            if (window.scrollY > 420) {
                stickyBar.classList.add('visible');
            } else {
                stickyBar.classList.remove('visible');
            }
        }, { passive: true });

        // Keyboard navigation for Quick View Modal (ArrowLeft / ArrowRight)
        document.addEventListener('keydown', function(e) {
            const qvModal = document.getElementById('quickViewModal');
            if (qvModal && qvModal.classList.contains('show')) {
                // If user is not typing in an input
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    navigateQvProduct(-1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    navigateQvProduct(1);
                }
            }
        });
    });

    // View mode switch (Grid vs Compact vs List)
    function switchViewMode(mode, save = true) {
        const grid = document.getElementById('productsGrid');
        const gridBtn = document.getElementById('viewModeGridBtn');
        const compactBtn = document.getElementById('viewModeCompactBtn');
        const listBtn = document.getElementById('viewModeListBtn');
        if (!grid) return;

        grid.classList.remove('view-mode-compact', 'view-mode-list');
        [gridBtn, compactBtn, listBtn].forEach(b => b?.classList.remove('active'));

        if (mode === 'compact') {
            grid.classList.add('view-mode-compact');
            if (compactBtn) compactBtn.classList.add('active');
        } else if (mode === 'list') {
            grid.classList.add('view-mode-list');
            if (listBtn) listBtn.classList.add('active');
        } else {
            if (gridBtn) gridBtn.classList.add('active');
        }

        if (save) {
            localStorage.setItem('sib_catalog_view_mode', mode);
        }
    }

    // Scroll Category Tabs
    function scrollTabsLeft() {
        const container = document.getElementById('catalogTabsContainer');
        if (container) container.scrollBy({ left: -220, behavior: 'smooth' });
    }

    function scrollTabsRight() {
        const container = document.getElementById('catalogTabsContainer');
        if (container) container.scrollBy({ left: 220, behavior: 'smooth' });
    }

    // Category filter tab click
    function filterCatalog(categorySlug, updateUrl = true, resetPage = true) {
        if (resetPage) currentPage = 1;
        document.querySelectorAll('.category-tab-btn').forEach(btn => {
            if (btn.getAttribute('data-cat') === categorySlug) {
                btn.classList.add('active');
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            } else {
                btn.classList.remove('active');
            }
        });

        // Sync sticky select
        const stickySelect = document.getElementById('stickyCatSelect');
        if (stickySelect) stickySelect.value = categorySlug;

        applyCatalogFilters(updateUrl, false);
    }

    // Quick filter pills handler
    function setQuickFilter(type, updateUrl = true, resetPage = true) {
        if (resetPage) currentPage = 1;
        activeQuickFilter = type;
        
        const pillAll = document.getElementById('pillAllBtn');
        const pillSale = document.getElementById('pillSaleBtn');
        const pillHits = document.getElementById('pillHitsBtn');
        const pillGost = document.getElementById('pillGostBtn');
        const favBtn = document.getElementById('favFilterBtn');

        [pillAll, pillSale, pillHits, pillGost].forEach(btn => btn?.classList.remove('active', 'active-sale'));
        if (favBtn) favBtn.classList.remove('active-fav');

        if (type === 'sale') {
            if (pillSale) pillSale.classList.add('active-sale');
        } else if (type === 'hits') {
            if (pillHits) pillHits.classList.add('active');
        } else if (type === 'gost') {
            if (pillGost) pillGost.classList.add('active');
        } else if (type === 'favorites') {
            if (favBtn) favBtn.classList.add('active-fav');
        } else {
            if (pillAll) pillAll.classList.add('active');
        }

        applyCatalogFilters(updateUrl, false);
    }

    // Price Filter Preset
    function setPriceFilter(type, label) {
        currentPage = 1;
        activePriceFilter = type;
        const labelEl = document.getElementById('priceFilterLabel');
        if (labelEl) labelEl.textContent = `Цена: ${label}`;
        applyCatalogFilters(true, false);
    }

    // Search tag pills click
    function setSearchTag(tag) {
        currentPage = 1;
        const searchInput = document.getElementById('catalogSearchInput');
        if (searchInput) {
            searchInput.value = tag;
            applyCatalogFilters(true, false);
            // Scroll to control hub
            document.querySelector('.catalog-control-hub')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function clearSearchInput() {
        currentPage = 1;
        const searchInput = document.getElementById('catalogSearchInput');
        const stickySearch = document.getElementById('stickySearchInput');
        if (searchInput) searchInput.value = '';
        if (stickySearch) stickySearch.value = '';
        applyCatalogFilters(true, false);
    }

    function syncStickySearch(val) {
        currentPage = 1;
        const searchInput = document.getElementById('catalogSearchInput');
        if (searchInput) searchInput.value = val;
        applyCatalogFilters(true, false);
    }

    function onSearchInput() {
        currentPage = 1;
        applyCatalogFilters(true, false);
    }

    function onSortChange() {
        currentPage = 1;
        applyCatalogFilters(true, false);
    }

    // Stepper logic on cards
    function stepCardQty(prodId, delta) {
        const input = document.getElementById(`qty_input_${prodId}`);
        if (!input) return;
        let val = parseInt(input.value) || 1;
        if (delta !== 0) {
            val += delta;
        }
        val = Math.max(1, Math.min(999, val));
        input.value = val;

        recalculateCardPrice(prodId, val);
    }

    function recalculateCardPrice(prodId, qty) {
        const cardCol = document.querySelector(`.product-card-col[data-id="${prodId}"]`);
        if (!cardCol) return;

        const numPrice = parseFloat(cardCol.getAttribute('data-price')) || 0;
        const oldPrice = parseFloat(cardCol.getAttribute('data-old-price')) || 0;
        const basePriceDisplay = cardCol.getAttribute('data-price-display');

        const labelEl = document.getElementById(`price_label_${prodId}`);
        const valEl = document.getElementById(`price_val_${prodId}`);
        const oldValEl = document.getElementById(`old_price_val_${prodId}`);
        const cartBtn = document.getElementById(`cart_btn_${prodId}`);

        if (numPrice > 0) {
            const total = numPrice * qty;
            const formattedTotal = total.toLocaleString('ru-RU') + ' ₽';
            if (valEl) valEl.textContent = formattedTotal;

            if (oldPrice > 0 && oldValEl) {
                oldValEl.textContent = (oldPrice * qty).toLocaleString('ru-RU') + ' ₽';
            }

            if (qty > 1) {
                if (labelEl) labelEl.textContent = `Итого за ${qty} шт. (${numPrice} ₽/шт):`;
                if (cartBtn) {
                    const textSpan = cartBtn.querySelector('.btn-text');
                    if (textSpan) textSpan.textContent = `В корзину • ${formattedTotal}`;
                }
            } else {
                if (labelEl) labelEl.textContent = 'Цена:';
                if (cartBtn) {
                    const textSpan = cartBtn.querySelector('.btn-text');
                    if (textSpan) textSpan.textContent = 'В корзину';
                }
            }
        } else {
            if (labelEl) labelEl.textContent = qty > 1 ? `Кол-во: ${qty} шт.` : 'Цена:';
            if (cartBtn) {
                const textSpan = cartBtn.querySelector('.btn-text');
                if (textSpan) textSpan.textContent = qty > 1 ? `В корзину (${qty} шт.)` : 'В корзину';
            }
        }
    }

    function addCardProductToCart(prodId) {
        const cardCol = document.querySelector(`.product-card-col[data-id="${prodId}"]`);
        if (!cardCol) return;

        const title = cardCol.getAttribute('data-title');
        const priceDisplay = cardCol.getAttribute('data-price-display');
        const img = cardCol.getAttribute('data-image');
        const numPrice = parseFloat(cardCol.getAttribute('data-price')) || 0;
        const qtyInput = document.getElementById(`qty_input_${prodId}`);
        const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;

        if (typeof addToCart === 'function') {
            addToCart(title, priceDisplay, img, numPrice, qty);
        }

        // Button Animation Feedback
        const btn = document.getElementById(`cart_btn_${prodId}`);
        if (btn) {
            btn.classList.add('btn-added-state');
            const prevHtml = btn.innerHTML;
            btn.innerHTML = `<i class="bi bi-check2-circle"></i><span class="btn-text">Добавлено (${qty} шт.)!</span>`;
            setTimeout(() => {
                btn.classList.remove('btn-added-state');
                btn.innerHTML = prevHtml;
                recalculateCardPrice(prodId, qty);
            }, 1400);
        }
    }

    // Quick View Modal Stepper & Actions
    function stepQvQty(delta) {
        const input = document.getElementById('qvQtyInput');
        if (!input) return;
        let val = parseInt(input.value) || 1;
        if (delta !== 0) {
            val += delta;
        }
        val = Math.max(1, Math.min(999, val));
        input.value = val;

        recalculateQvPrice(val);
    }

    function recalculateQvPrice(qty) {
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        if (!cardCol) return;

        const numPrice = parseFloat(cardCol.getAttribute('data-price')) || 0;
        const oldPrice = parseFloat(cardCol.getAttribute('data-old-price')) || 0;
        const basePriceDisplay = cardCol.getAttribute('data-price-display');

        const priceEl = document.getElementById('qvProductPrice');
        const oldPriceEl = document.getElementById('qvProductOldPrice');
        const calcNote = document.getElementById('qvCalcNote');
        const calcFormula = document.getElementById('qvCalcFormula');
        const addBtn = document.getElementById('qvAddToCartBtn');

        if (numPrice > 0) {
            const total = numPrice * qty;
            const formattedTotal = total.toLocaleString('ru-RU') + ' ₽';
            if (priceEl) priceEl.textContent = formattedTotal;

            if (oldPrice > 0 && oldPriceEl) {
                oldPriceEl.textContent = `${(oldPrice * qty).toLocaleString('ru-RU')} ₽`;
            }

            if (qty > 1) {
                if (calcNote) calcNote.style.display = 'block';
                if (calcFormula) calcFormula.textContent = `Расчет: ${numPrice.toLocaleString('ru-RU')} ₽ × ${qty} шт. = ${formattedTotal} (${numPrice} ₽ за 1 шт.)`;
                if (addBtn) addBtn.innerHTML = `<i class="bi bi-cart-plus me-1"></i>В корзину • ${formattedTotal} (${qty} шт.)`;
            } else {
                if (calcNote) calcNote.style.display = 'none';
                if (addBtn) addBtn.innerHTML = `<i class="bi bi-cart-plus me-1"></i>В корзину • ${formattedTotal}`;
            }
        } else {
            if (priceEl && basePriceDisplay) priceEl.textContent = basePriceDisplay;
            if (addBtn) {
                addBtn.innerHTML = qty > 1 ? `<i class="bi bi-cart-plus me-1"></i>В корзину (${qty} шт.)` : `<i class="bi bi-cart-plus me-1"></i>В корзину`;
            }
        }
    }

    // Helper: get product IDs belonging to current category & filter query
    function getVisibleCatalogProductIds() {
        const allCards = Array.from(document.querySelectorAll('.product-card-col'));
        let matched = allCards.filter(col => col.dataset.matched === 'true');
        
        // If not yet tagged, filter by current category tab
        if (!matched.length) {
            const activeTab = document.querySelector('.category-tab-btn.active');
            const activeCat = activeTab ? (activeTab.getAttribute('data-cat') || 'all').toLowerCase() : 'all';
            if (activeCat !== 'all' && activeCat !== 'sale') {
                matched = allCards.filter(col => (col.getAttribute('data-category') || '').toLowerCase() === activeCat);
            }
        }

        // Fallback: visible cards on current page or all cards
        if (!matched.length) {
            matched = allCards.filter(c => c.style.display !== 'none');
        }
        if (!matched.length) {
            matched = allCards;
        }

        return matched.map(c => parseInt(c.getAttribute('data-id'))).filter(id => !isNaN(id));
    }

    function updateQvNavigationControls() {
        const visibleIds = getVisibleCatalogProductIds();
        const currentIdx = visibleIds.indexOf(parseInt(currentQvProductId));
        const prevBtn = document.getElementById('qvPrevBtn');
        const nextBtn = document.getElementById('qvNextBtn');
        const counterEl = document.getElementById('qvNavCounter');

        if (counterEl) {
            if (currentIdx !== -1 && visibleIds.length > 0) {
                counterEl.textContent = `${currentIdx + 1} / ${visibleIds.length}`;
            } else {
                counterEl.textContent = '1 / 1';
            }
        }

        if (prevBtn) {
            prevBtn.disabled = currentIdx <= 0;
        }
        if (nextBtn) {
            nextBtn.disabled = currentIdx === -1 || currentIdx >= visibleIds.length - 1;
        }
    }

    function navigateQvProduct(direction) {
        const visibleIds = getVisibleCatalogProductIds();
        if (!visibleIds.length) return;
        const currentIdx = visibleIds.indexOf(parseInt(currentQvProductId));
        let targetIdx = currentIdx + direction;
        if (targetIdx < 0 || targetIdx >= visibleIds.length) return;

        const nextId = visibleIds[targetIdx];
        const modalContent = document.querySelector('.quick-view-modal-content');
        if (modalContent) {
            modalContent.classList.add('qv-animating');
            setTimeout(() => {
                openQuickView(nextId);
                modalContent.classList.remove('qv-animating');
            }, 120);
        } else {
            openQuickView(nextId);
        }
    }

    // Parse KBJU string into individual components
    function parseNutritionalValues(nutrStr) {
        if (!nutrStr || !nutrStr.trim()) return null;
        let kcal = '', prot = '', fat = '', carb = '';

        const kcalMatch = nutrStr.match(/(\d+[\.,]?\d*)\s*(?:ккал|kcal)/i);
        if (kcalMatch) kcal = kcalMatch[1];

        const protMatch = nutrStr.match(/белк[^\d]*(\d+[\.,]?\d*)\s*г/i);
        if (protMatch) prot = protMatch[1] + ' г';

        const fatMatch = nutrStr.match(/жир[^\d]*(\d+[\.,]?\d*)\s*г/i);
        if (fatMatch) fat = fatMatch[1] + ' г';

        const carbMatch = nutrStr.match(/углевод[^\d]*(\d+[\.,]?\d*)\s*г/i);
        if (carbMatch) carb = carbMatch[1] + ' г';

        return { kcal: kcal || '—', prot: prot || '—', fat: fat || '—', carb: carb || '—' };
    }

    function openQuickView(prodId) {
        const cardCol = document.querySelector(`.product-card-col[data-id="${prodId}"]`);
        if (!cardCol) return;

        currentQvProductId = prodId;

        const title = cardCol.getAttribute('data-title');
        const catName = cardCol.getAttribute('data-category-name');
        const desc = cardCol.getAttribute('data-desc');
        const fullDesc = cardCol.getAttribute('data-full-desc');
        const priceDisplay = cardCol.getAttribute('data-price-display');
        const oldPrice = parseFloat(cardCol.getAttribute('data-old-price')) || 0;
        const discountPct = parseInt(cardCol.getAttribute('data-discount-pct')) || 0;
        const hasDiscount = cardCol.getAttribute('data-has-discount') === 'true';
        const img = cardCol.getAttribute('data-image');
        const rating = cardCol.getAttribute('data-rating') || '4.9';
        const reviewsCount = cardCol.getAttribute('data-reviews-count') || '14';
        const standard = cardCol.getAttribute('data-standard');
        const fat = cardCol.getAttribute('data-fat');
        const weight = cardCol.getAttribute('data-weight');
        const shelf = cardCol.getAttribute('data-shelf');
        const pkg = cardCol.getAttribute('data-package');
        const storage = cardCol.getAttribute('data-storage');
        const composition = cardCol.getAttribute('data-composition');
        const nutritional = cardCol.getAttribute('data-nutritional');
        const cookingTips = cardCol.getAttribute('data-cooking-tips');
        const sku = cardCol.getAttribute('data-sku') || `SIB-${String(prodId).padStart(4, '0')}`;
        const badge = cardCol.getAttribute('data-badge') || '';
        const detailUrl = cardCol.getAttribute('data-url');
        const wsPrice = cardCol.getAttribute('data-wholesale-price');
        const wsMin = cardCol.getAttribute('data-wholesale-min');

        // Populate modal fields
        const titleEl = document.getElementById('qvProductTitle');
        if (titleEl) titleEl.textContent = title;

        const catBadge = document.getElementById('qvCategoryBadge');
        if (catBadge) catBadge.textContent = catName;

        const ratingVal = document.getElementById('qvRatingVal');
        if (ratingVal) ratingVal.textContent = `${rating} (${reviewsCount})`;

        const skuVal = document.getElementById('qvSkuVal');
        if (skuVal) skuVal.textContent = sku;

        const imgEl = document.getElementById('qvProductImage');
        if (imgEl) {
            imgEl.src = img;
            imgEl.alt = title;
        }

        const priceEl = document.getElementById('qvProductPrice');
        if (priceEl) priceEl.textContent = priceDisplay;

        const oldPriceWrap = document.getElementById('qvOldPriceWrap');
        const oldPriceEl = document.getElementById('qvProductOldPrice');
        const discountBadgeEl = document.getElementById('qvDiscountBadge');
        if (hasDiscount && oldPrice > 0) {
            if (oldPriceEl) oldPriceEl.textContent = `${oldPrice.toLocaleString('ru-RU')} ₽`;
            if (oldPriceWrap) oldPriceWrap.classList.remove('d-none');
            if (discountPct > 0) {
                if (discountBadgeEl) {
                    discountBadgeEl.textContent = `-${discountPct}%`;
                    discountBadgeEl.classList.remove('d-none');
                }
            } else if (discountBadgeEl) {
                discountBadgeEl.classList.add('d-none');
            }
        } else {
            if (oldPriceWrap) oldPriceWrap.classList.add('d-none');
            if (discountBadgeEl) discountBadgeEl.classList.add('d-none');
        }

        // Wholesale Price in Quick View
        const qvWsBox = document.getElementById('qvWholesaleBox');
        const qvWsPrice = document.getElementById('qvWholesalePrice');
        const qvWsCond = document.getElementById('qvWholesaleCondition');
        if (qvWsBox && wsPrice && wsPrice.trim()) {
            if (qvWsPrice) qvWsPrice.textContent = wsPrice;
            if (qvWsCond) {
                if (wsMin && wsMin.trim()) {
                    qvWsCond.textContent = wsMin;
                    qvWsCond.classList.remove('d-none');
                } else {
                    qvWsCond.classList.add('d-none');
                }
            }
            qvWsBox.classList.remove('d-none');
        } else if (qvWsBox) {
            qvWsBox.classList.add('d-none');
        }

        const descEl = document.getElementById('qvProductDesc');
        if (descEl) descEl.textContent = fullDesc || desc;

        // Specs Table
        setModalRow('qvRowStandard', 'qvStandardVal', standard);
        setModalRow('qvRowFat', 'qvFatVal', fat);
        setModalRow('qvRowWeight', 'qvWeightVal', weight);
        setModalRow('qvRowPackage', 'qvPackageVal', pkg);
        setModalRow('qvRowShelf', 'qvShelfVal', shelf);
        setModalRow('qvRowStorage', 'qvStorageVal', storage);

        // Composition
        const compVal = document.getElementById('qvCompositionVal');
        if (compVal) {
            compVal.textContent = (composition && composition.trim()) 
                ? composition 
                : 'Отборное молоко коровье цельное пастеризованное, закваска чистых культур молочнокислых микроорганизмов, сычужный фермент, соль поваренная пищевая.';
        }

        // KBJU cards
        const kbju = parseNutritionalValues(nutritional);
        const kcalEl = document.getElementById('qvKbjuKcal');
        const protEl = document.getElementById('qvKbjuProt');
        const fatEl = document.getElementById('qvKbjuFat');
        const carbEl = document.getElementById('qvKbjuCarb');
        if (kbju) {
            if (kcalEl) kcalEl.textContent = kbju.kcal;
            if (protEl) protEl.textContent = kbju.prot;
            if (fatEl) fatEl.textContent = kbju.fat;
            if (carbEl) carbEl.textContent = kbju.carb;
        } else {
            if (kcalEl) kcalEl.textContent = '265';
            if (protEl) protEl.textContent = '19.5 г';
            if (fatEl) fatEl.textContent = '21.0 г';
            if (carbEl) carbEl.textContent = '0 г';
        }

        // Cooking Tips & Gastronomy Tab
        const tipsTabBtn = document.getElementById('qvTabBtnTips');
        const tipsVal = document.getElementById('qvCookingTipsVal');
        if (cookingTips && cookingTips.trim()) {
            if (tipsVal) tipsVal.textContent = cookingTips;
            if (tipsTabBtn) tipsTabBtn.classList.remove('d-none');
        } else {
            if (tipsTabBtn) tipsTabBtn.classList.add('d-none');
        }

        // Reset tabs to default (Specifications)
        const specsTabBtn = document.getElementById('qvTabBtnSpecs');
        if (specsTabBtn && typeof bootstrap !== 'undefined') {
            const tabInstance = bootstrap.Tab.getOrCreateInstance(specsTabBtn);
            tabInstance.show();
        }

        // Badges
        const badgesBox = document.getElementById('qvBadgesContainer');
        if (badgesBox) {
            let badgesHtml = '';
            if (hasDiscount && discountPct > 0) {
                badgesHtml += `<span class="badge-tag-custom badge-tag-sale"><i class="bi bi-fire"></i> -${discountPct}%</span>`;
            } else if (hasDiscount) {
                badgesHtml += `<span class="badge-tag-custom badge-tag-sale"><i class="bi bi-fire"></i> АКЦИЯ</span>`;
            }
            if (badge && badge.trim()) {
                badgesHtml += `<span class="badge-tag-custom badge-tag-hit"><i class="bi bi-star-fill"></i> ${badge}</span>`;
            }
            if (standard && standard.toLowerCase().includes('гост')) {
                badgesHtml += `<span class="badge-tag-custom badge-tag-gost"><i class="bi bi-patch-check-fill"></i> ГОСТ</span>`;
            }
            badgesBox.innerHTML = badgesHtml;
        }

        // Wishlist Favorite state sync in Quick View
        syncQvFavoriteBtn(prodId);

        // Reset Stepper and Price Calculation
        const qvQty = document.getElementById('qvQtyInput');
        if (qvQty) qvQty.value = '1';
        recalculateQvPrice(1);

        // Detail Link
        const detailBtn = document.getElementById('qvDetailLink');
        if (detailBtn) detailBtn.href = detailUrl;

        // Update Prev / Next Buttons & Counter
        updateQvNavigationControls();

        // Show Modal
        const modalEl = document.getElementById('quickViewModal');
        if (modalEl) {
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
        }
    }

    function syncQvFavoriteBtn(prodId) {
        const favBtn = document.getElementById('qvFavBtn');
        if (!favBtn) return;
        const favs = getFavorites();
        const isFav = favs.includes(parseInt(prodId));
        favBtn.classList.toggle('active', isFav);
        const icon = favBtn.querySelector('i');
        if (icon) {
            icon.className = isFav ? 'bi bi-heart-fill' : 'bi bi-heart';
        }
    }

    function toggleQvFavorite(e) {
        if (e) e.stopPropagation();
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        const title = cardCol ? cardCol.getAttribute('data-title') : 'Товар';
        toggleFavorite(e, currentQvProductId, title);
        syncQvFavoriteBtn(currentQvProductId);
    }

    function copyQvSku() {
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        const sku = cardCol ? (cardCol.getAttribute('data-sku') || `SIB-${String(currentQvProductId).padStart(4, '0')}`) : 'SIB-0001';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(sku).then(() => {
                if (typeof showToast === 'function') {
                    showToast(`Артикул «${sku}» скопирован в буфер обмена! 📋`);
                }
            });
        }
    }

    function copyQvDirectUrl(e) {
        if (e) e.stopPropagation();
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        if (!cardCol) return;
        const relUrl = cardCol.getAttribute('data-url');
        const fullUrl = window.location.origin + relUrl;
        const title = cardCol.getAttribute('data-title');

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullUrl).then(() => {
                if (typeof showToast === 'function') {
                    showToast(`Ссылка на «${title}» скопирована! 🔗`);
                }
            });
        }
    }

    function openQvFullImage() {
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        if (!cardCol) return;
        const img = cardCol.getAttribute('data-image');
        const title = cardCol.getAttribute('data-title');
        
        const fullImg = document.getElementById('qvFullImageSrc');
        const fullTitle = document.getElementById('qvFullImageTitle');
        if (fullImg) fullImg.src = img;
        if (fullTitle) fullTitle.textContent = title;

        const imgModalEl = document.getElementById('qvImageModal');
        if (imgModalEl) {
            const imgModal = bootstrap.Modal.getOrCreateInstance(imgModalEl);
            imgModal.show();
        }
    }

    function openQvOneClickOrder() {
        if (!currentQvProductId) return;
        const cardCol = document.querySelector(`.product-card-col[data-id="${currentQvProductId}"]`);
        if (!cardCol) return;

        const title = cardCol.getAttribute('data-title');
        const sku = cardCol.getAttribute('data-sku') || `SIB-${String(currentQvProductId).padStart(4, '0')}`;
        const price = cardCol.getAttribute('data-price-display');
        const qtyInput = document.getElementById('qvQtyInput');
        const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;

        // Hide Quick View modal
        const qvModalEl = document.getElementById('quickViewModal');
        if (qvModalEl) {
            const qvModal = bootstrap.Modal.getInstance(qvModalEl);
            if (qvModal) qvModal.hide();
        }

        // Open Callback Modal pre-filled
        const callbackModalEl = document.getElementById('callbackModal');
        if (callbackModalEl) {
            const callbackModal = bootstrap.Modal.getOrCreateInstance(callbackModalEl);
            const reqTypeSelect = callbackModalEl.querySelector('select[name="request_type"]');
            if (reqTypeSelect) reqTypeSelect.value = 'question';

            const msgTextarea = callbackModalEl.querySelector('textarea[name="message"]');
            if (msgTextarea) {
                msgTextarea.value = `Быстрый заказ: «${title}» (Артикул: ${sku}), количество: ${qty} шт. Цена: ${price}. Пожалуйста, свяжитесь со мной для уточнения деталей.`;
            }

            callbackModal.show();
        } else {
            addQvProductToCart();
        }
    }

    function setModalRow(rowId, valId, value) {
        const row = document.getElementById(rowId);
        const val = document.getElementById(valId);
        if (!row || !val) return;
        if (value && value.trim()) {
            val.textContent = value;
            row.classList.remove('d-none');
        } else {
            row.classList.add('d-none');
        }
    }

    function addQvProductToCart() {
        if (!currentQvProductId) return;
        const qtyInput = document.getElementById('qvQtyInput');
        const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;

        // Sync card stepper and recalculate card price
        const cardQtyInput = document.getElementById(`qty_input_${currentQvProductId}`);
        if (cardQtyInput) {
            cardQtyInput.value = qty;
            recalculateCardPrice(currentQvProductId, qty);
        }

        addCardProductToCart(currentQvProductId);

        const btn = document.getElementById('qvAddToCartBtn');
        if (btn) {
            btn.innerHTML = `<i class="bi bi-check2-circle me-1"></i>Добавлено (${qty} шт.)!`;
            btn.classList.add('btn-success');
            btn.classList.remove('btn-sib-orange');
            setTimeout(() => {
                btn.classList.remove('btn-success');
                btn.classList.add('btn-sib-orange');
                recalculateQvPrice(qty);
            }, 1200);
        }
    }

    // Comprehensive filtering, sorting & pagination engine (9 items per page)
    function applyCatalogFilters(updateUrl = true, resetPage = false) {
        if (resetPage) {
            currentPage = 1;
        }

        const activeTab = document.querySelector('.category-tab-btn.active');
        const activeCat = activeTab ? activeTab.getAttribute('data-cat') : 'all';
        const searchInput = document.getElementById('catalogSearchInput');
        const searchQuery = (searchInput?.value || '').toLowerCase().trim();
        const clearBtn = document.getElementById('catalogSearchClearBtn');
        if (clearBtn) clearBtn.classList.toggle('d-none', !searchQuery);

        const sortSelect = document.getElementById('catalogSortSelect');
        const currentSort = sortSelect ? sortSelect.value : 'default';

        const queryWords = searchQuery.split(/\s+/).filter(w => w.length > 0);
        const grid = document.getElementById('productsGrid');
        const allCards = Array.from(document.querySelectorAll('.product-card-col'));

        const favs = getFavorites();
        let matchedCards = [];

        allCards.forEach(col => {
            const id = parseInt(col.getAttribute('data-id')) || 0;
            const cat = (col.getAttribute('data-category') || '').toLowerCase();
            const title = (col.getAttribute('data-title') || '').toLowerCase();
            const desc = (col.getAttribute('data-desc') || '').toLowerCase();
            const fat = (col.getAttribute('data-fat') || '').toLowerCase();
            const standard = (col.getAttribute('data-standard') || '').toLowerCase();
            const pkg = (col.getAttribute('data-package') || '').toLowerCase();
            const price = parseFloat(col.getAttribute('data-price')) || 0;
            const hasDiscount = col.getAttribute('data-has-discount') === 'true';
            const isHit = col.getAttribute('data-is-hit') === 'true';
            const isGost = col.getAttribute('data-is-gost') === 'true';

            // 1. Category tab match
            let matchCat = false;
            if (activeCat === 'all') {
                matchCat = true;
            } else if (activeCat === 'sale') {
                matchCat = hasDiscount;
            } else {
                matchCat = (cat === activeCat);
            }

            // 2. Quick filter pill match
            let matchQuick = true;
            if (activeQuickFilter === 'sale') {
                matchQuick = hasDiscount;
            } else if (activeQuickFilter === 'hits') {
                matchQuick = isHit;
            } else if (activeQuickFilter === 'gost') {
                matchQuick = isGost;
            } else if (activeQuickFilter === 'favorites') {
                matchQuick = favs.includes(id);
            }

            // 3. Price preset filter match
            let matchPrice = true;
            if (activePriceFilter === 'under_300') {
                matchPrice = (price > 0 && price <= 300);
            } else if (activePriceFilter === '300_600') {
                matchPrice = (price > 300 && price <= 600);
            } else if (activePriceFilter === 'over_600') {
                matchPrice = (price > 600);
            }

            // 4. Search query match (searches title, description, fat, standard, package)
            const matchSearch = queryWords.length === 0 || queryWords.every(w => 
                title.includes(w) || 
                desc.includes(w) || 
                cat.includes(w) ||
                fat.includes(w) ||
                standard.includes(w) ||
                pkg.includes(w)
            );

            if (matchCat && matchQuick && matchPrice && matchSearch) {
                matchedCards.push(col);
                col.dataset.matched = 'true';
            } else {
                col.dataset.matched = 'false';
                col.style.display = 'none';
            }
        });

        // Sorting visible cards in DOM
        if (grid) {
            allCards.sort((a, b) => {
                const priceA = parseFloat(a.getAttribute('data-price')) || 0;
                const priceB = parseFloat(b.getAttribute('data-price')) || 0;
                const titleA = a.getAttribute('data-title') || '';
                const titleB = b.getAttribute('data-title') || '';
                const discA = parseFloat(a.getAttribute('data-discount-pct')) || 0;
                const discB = parseFloat(b.getAttribute('data-discount-pct')) || 0;
                const ratingA = parseFloat(a.getAttribute('data-rating')) || 0;
                const ratingB = parseFloat(b.getAttribute('data-rating')) || 0;
                const orderA = parseInt(a.getAttribute('data-order')) || 0;
                const orderB = parseInt(b.getAttribute('data-order')) || 0;
                const idA = parseInt(a.getAttribute('data-id')) || 0;
                const idB = parseInt(b.getAttribute('data-id')) || 0;

                switch (currentSort) {
                    case 'price_asc':
                        return priceA - priceB;
                    case 'price_desc':
                        return priceB - priceA;
                    case 'discount':
                        return discB - discA;
                    case 'rating_desc':
                        return ratingB - ratingA;
                    case 'title_asc':
                        return titleA.localeCompare(titleB, 'ru');
                    case 'default':
                    default:
                        return orderA !== orderB ? (orderA - orderB) : (idA - idB);
                }
            });

            allCards.forEach(card => grid.appendChild(card));
        }

        // 5. Pagination Calculation (9 items per page)
        const totalItems = matchedCards.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / ITEMS_PER_PAGE));

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }
        if (currentPage < 1) {
            currentPage = 1;
        }

        const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
        const endIndex = startIndex + ITEMS_PER_PAGE;

        // Hide all cards first
        allCards.forEach(card => card.style.display = 'none');

        // Show only matching cards for current page slice in sorted order
        const sortedMatched = allCards.filter(c => matchedCards.includes(c));
        sortedMatched.forEach((card, idx) => {
            if (idx >= startIndex && idx < endIndex) {
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });

        // 6. Update counts and indicators
        const shownFrom = totalItems > 0 ? (startIndex + 1) : 0;
        const shownTo = Math.min(endIndex, totalItems);

        const countDisplay = document.getElementById('catalogCountDisplay');
        if (countDisplay) {
            if (totalItems > 0) {
                countDisplay.innerHTML = `<i class="bi bi-box-seam text-warning me-1"></i>Показано: <strong>${shownFrom}–${shownTo}</strong> из <strong>${totalItems}</strong> товаров <span class="badge bg-light text-muted border rounded-pill ms-2 d-none d-sm-inline">По 9 на странице</span>`;
            } else {
                countDisplay.innerHTML = `<i class="bi bi-box-seam text-warning me-1"></i>Найдено: <strong>0</strong> товаров`;
            }
        }

        const curPageTop = document.getElementById('currentPageTopVal');
        const totPageTop = document.getElementById('totalPagesTopVal');
        const quickPageInfo = document.getElementById('catalogQuickPageInfo');
        if (curPageTop) curPageTop.textContent = currentPage;
        if (totPageTop) totPageTop.textContent = totalPages;
        if (quickPageInfo) {
            quickPageInfo.classList.toggle('d-none', totalPages <= 1);
        }

        // 7. Render Pagination Component
        renderPagination(totalItems, totalPages, currentPage);

        // 8. Update Active Filters ribbon chips
        updateActiveFilterChips(activeCat, searchQuery, activeQuickFilter, activePriceFilter);

        // 9. Toggle No Results State
        const noResults = document.getElementById('noCatalogResults');
        if (noResults) {
            noResults.classList.toggle('d-none', totalItems > 0);
        }

        // 10. Update browser URL query params
        if (updateUrl && history.pushState) {
            const params = new URLSearchParams();
            if (activeCat !== 'all') params.set('cat', activeCat);
            if (currentSort !== 'default') params.set('sort', currentSort);
            if (searchQuery) params.set('q', searchQuery);
            if (activeQuickFilter !== 'all') params.set('filter', activeQuickFilter);
            if (currentPage > 1) params.set('page', currentPage);

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            history.pushState({ page: currentPage, cat: activeCat, sort: currentSort, q: searchQuery, filter: activeQuickFilter }, '', newUrl);
        }
    }

    // Pagination Navigation Handlers
    function goToPage(page, smoothScroll = true) {
        page = parseInt(page);
        if (isNaN(page) || page < 1 || page === currentPage) return;
        currentPage = page;
        applyCatalogFilters(true, false);
        if (smoothScroll) {
            scrollToCatalogTop();
        }
    }

    function scrollToCatalogTop() {
        const target = document.getElementById('catalogResultsMeta') || document.getElementById('productsGrid') || document.querySelector('.catalog-control-hub');
        if (target) {
            const rect = target.getBoundingClientRect();
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const targetTop = rect.top + scrollTop - 85;
            window.scrollTo({
                top: Math.max(0, targetTop),
                behavior: 'smooth'
            });
        }
    }

    function renderPagination(totalItems, totalPages, curPage) {
        const paginationNav = document.getElementById('catalogPaginationNav');
        const paginationList = document.getElementById('catalogPaginationList');
        const paginationSummary = document.getElementById('catalogPaginationSummary');
        if (!paginationNav || !paginationList) return;

        if (totalItems <= ITEMS_PER_PAGE || totalPages <= 1) {
            paginationNav.classList.add('d-none');
            return;
        }
        paginationNav.classList.remove('d-none');

        // Summary text
        const fromIdx = (curPage - 1) * ITEMS_PER_PAGE + 1;
        const toIdx = Math.min(curPage * ITEMS_PER_PAGE, totalItems);
        if (paginationSummary) {
            paginationSummary.innerHTML = `Показано <strong class="text-dark">${fromIdx}–${toIdx}</strong> из <strong class="text-dark">${totalItems}</strong> товаров <span class="text-muted">(Страница ${curPage} из ${totalPages})</span>`;
        }

        let html = '';

        // "Назад" / Previous button
        const isPrevDisabled = (curPage <= 1);
        html += `
            <li class="page-item ${isPrevDisabled ? 'disabled' : ''}">
                <button type="button" class="page-link prev-next-link" onclick="goToPage(${curPage - 1})" ${isPrevDisabled ? 'disabled aria-disabled="true"' : ''} aria-label="Предыдущая страница">
                    <i class="bi bi-chevron-left me-1"></i><span class="d-none d-sm-inline">Назад</span>
                </button>
            </li>
        `;

        // Smart page numbers
        const pages = getPaginationPageNumbers(curPage, totalPages);
        pages.forEach(p => {
            if (p === '...') {
                html += `
                    <li class="page-item disabled">
                        <span class="page-link ellipsis-link">&hellip;</span>
                    </li>
                `;
            } else {
                const isActive = (p === curPage);
                html += `
                    <li class="page-item ${isActive ? 'active' : ''}">
                        <button type="button" class="page-link ${isActive ? 'current-page' : ''}" onclick="goToPage(${p})" ${isActive ? 'aria-current="page"' : ''}>
                            ${p}
                        </button>
                    </li>
                `;
            }
        });

        // "Вперед" / Next button
        const isNextDisabled = (curPage >= totalPages);
        html += `
            <li class="page-item ${isNextDisabled ? 'disabled' : ''}">
                <button type="button" class="page-link prev-next-link" onclick="goToPage(${curPage + 1})" ${isNextDisabled ? 'disabled aria-disabled="true"' : ''} aria-label="Следующая страница">
                    <span class="d-none d-sm-inline">Вперед</span><i class="bi bi-chevron-right ms-1"></i>
                </button>
            </li>
        `;

        paginationList.innerHTML = html;
    }

    function getPaginationPageNumbers(current, total) {
        if (total <= 7) {
            return Array.from({ length: total }, (_, i) => i + 1);
        }
        const pages = [];
        pages.push(1);

        if (current > 3) {
            pages.push('...');
        }

        const start = Math.max(2, current - 1);
        const end = Math.min(total - 1, current + 1);

        for (let i = start; i <= end; i++) {
            pages.push(i);
        }

        if (current < total - 2) {
            pages.push('...');
        }

        pages.push(total);
        return pages;
    }

    // Handle Browser Back / Forward Buttons
    window.addEventListener('popstate', function(e) {
        const urlParams = new URLSearchParams(window.location.search);
        const pageParam = parseInt(urlParams.get('page')) || 1;
        const catParam = urlParams.get('cat') || 'all';
        const sortParam = urlParams.get('sort') || 'default';
        const qParam = urlParams.get('q') || '';
        const filterParam = urlParams.get('filter') || 'all';

        currentPage = pageParam;

        if (document.getElementById('catalogSortSelect')) {
            document.getElementById('catalogSortSelect').value = sortParam;
        }
        if (document.getElementById('catalogSearchInput')) {
            document.getElementById('catalogSearchInput').value = qParam;
        }

        setQuickFilter(filterParam, false, false);
        filterCatalog(catParam, false, false);
    });

    // Dynamic Filter Chips Renderer
    function updateActiveFilterChips(activeCat, searchQuery, quickFilter, priceFilter) {
        const container = document.getElementById('activeFiltersRow');
        if (!container) return;

        let chipsHtml = '<span class="small text-muted fw-bold me-1"><i class="bi bi-funnel-fill text-warning me-1"></i>Фильтры:</span>';
        let hasAnyFilter = false;

        if (activeCat && activeCat !== 'all') {
            hasAnyFilter = true;
            let catName = 'Акции и скидки';
            if (activeCat !== 'sale') {
                const activeTab = document.querySelector(`.category-tab-btn[data-cat="${activeCat}"]`);
                catName = activeTab ? (activeTab.querySelector('span')?.textContent || activeCat) : activeCat;
            }
            chipsHtml += `<button type="button" class="btn btn-sm btn-light border rounded-pill d-inline-flex align-items-center gap-1 py-1 px-3 shadow-2xs" onclick="filterCatalog('all', true)" title="Снять фильтр категории">
                <span class="text-muted">Категория:</span>
                <strong class="text-dark">${catName}</strong>
                <i class="bi bi-x-circle-fill text-muted ms-1"></i>
            </button>`;
        }

        if (quickFilter && quickFilter !== 'all') {
            hasAnyFilter = true;
            let filterName = 'Только со скидкой';
            if (quickFilter === 'hits') filterName = 'Хиты продаж';
            if (quickFilter === 'gost') filterName = 'По ГОСТу';
            if (quickFilter === 'favorites') filterName = 'В избранном';

            chipsHtml += `<button type="button" class="btn btn-sm btn-light border rounded-pill d-inline-flex align-items-center gap-1 py-1 px-3 shadow-2xs" onclick="setQuickFilter('all')" title="Снять фильтр">
                <strong class="text-dark">${filterName}</strong>
                <i class="bi bi-x-circle-fill text-muted ms-1"></i>
            </button>`;
        }

        if (priceFilter && priceFilter !== 'all') {
            hasAnyFilter = true;
            let priceLabel = 'Все цены';
            if (priceFilter === 'under_300') priceLabel = 'До 300 ₽';
            if (priceFilter === '300_600') priceLabel = '300 — 600 ₽';
            if (priceFilter === 'over_600') priceLabel = 'От 600 ₽';

            chipsHtml += `<button type="button" class="btn btn-sm btn-light border rounded-pill d-inline-flex align-items-center gap-1 py-1 px-3 shadow-2xs" onclick="setPriceFilter('all', 'Любая')" title="Сбросить фильтр цены">
                <span class="text-muted">Цена:</span>
                <strong class="text-dark">${priceLabel}</strong>
                <i class="bi bi-x-circle-fill text-muted ms-1"></i>
            </button>`;
        }

        if (searchQuery) {
            hasAnyFilter = true;
            chipsHtml += `<button type="button" class="btn btn-sm btn-light border rounded-pill d-inline-flex align-items-center gap-1 py-1 px-3 shadow-2xs" onclick="clearSearchInput()" title="Очистить поисковый запрос">
                <span class="text-muted">Поиск:</span>
                <strong class="text-dark">«${searchQuery}»</strong>
                <i class="bi bi-x-circle-fill text-muted ms-1"></i>
            </button>`;
        }

        if (hasAnyFilter) {
            chipsHtml += `<button type="button" class="btn btn-sm btn-link text-muted text-decoration-none py-1 px-2 ms-auto" onclick="resetAllFilters()">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Сбросить всё
            </button>`;
            container.innerHTML = chipsHtml;
            container.classList.remove('d-none');
        } else {
            container.innerHTML = '';
            container.classList.add('d-none');
        }
    }

    // Reset all filters button
    function resetAllFilters() {
        const searchInput = document.getElementById('catalogSearchInput');
        const stickySearch = document.getElementById('stickySearchInput');
        if (searchInput) searchInput.value = '';
        if (stickySearch) stickySearch.value = '';

        activeQuickFilter = 'all';
        activePriceFilter = 'all';
        currentPage = 1;

        const labelEl = document.getElementById('priceFilterLabel');
        if (labelEl) labelEl.textContent = 'Цена: Любая';

        const sortSelect = document.getElementById('catalogSortSelect');
        if (sortSelect) sortSelect.value = 'default';

        setQuickFilter('all', false, false);
        filterCatalog('all', true, true);
    }
</script>
